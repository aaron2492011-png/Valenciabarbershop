<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Valencia Barber Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Instrument+Serif&display=swap">
<style>
/* Concepto: columna de móvil centrada, negro cálido con dorado arena; foto de la barbería arriba en login e inicio, cabecera serif en el resto. */
:root{
  --bg:#0b0b0c; --card:#141416; --line:#2c2c2e; --chip:#1e1e22;
  --gold:#c5a880; --gold-soft:rgba(197,168,128,.2); --gold-line:rgba(197,168,128,.33);
  --fg:#ffffff; --mute:#8e8e93;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);overflow-x:hidden}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main.sin-nav{padding-bottom:max(32px,env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:24px;padding-top:24px;padding-bottom:24px}

/* Foto superior */
.hero{position:relative}
.hero img{display:block;width:100%;height:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to bottom,rgba(11,11,12,0),var(--bg));pointer-events:none}
.hero .bell{position:absolute;top:24px;right:max(20px,env(safe-area-inset-right,0px));z-index:2}

/* Campana */
.bell{display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#fff;text-decoration:none;flex:none}
.bell.gold{color:var(--gold)}
.bell svg{width:34px;height:34px}

/* Cabecera de pantalla */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:36px;padding-bottom:12px}
.hd h1{margin:0;font:400 32px/1.1 var(--serif);color:#fff}
.hd p{margin:2px 0 0;color:var(--mute);font-size:14px}

/* Piezas */
.lbl{margin:0 0 12px;font:700 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.lbl.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card.gold{border-color:var(--gold-line);border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{background:var(--gold-soft);color:var(--gold);font:700 10px/1 var(--sans);padding:5px 8px;border-radius:4px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--gold);color:#0b0b0c;border:0;border-radius:8px;padding:14px 24px;font:700 16px/1.2 var(--sans);text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line);padding:11px 18px;font-size:14px;font-weight:600;width:auto}
.btn.sm{width:auto;padding:11px 18px;font-size:14px}
.serif{font-family:var(--serif);font-weight:400}
.mute{color:var(--mute)}
.gold-t{color:var(--gold)}
/* Login */
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;margin-top:-6px}
.welcome{margin:0;font-size:12.5px;letter-spacing:.22em;line-height:1.6;color:#c9c9cc;font-weight:400}
.gline{width:44px;height:2px;background:var(--gold);margin:14px 0 36px}
.field{display:flex;align-items:center;gap:14px;width:100%;height:56px;padding:0 20px;background:#131315;border:1px solid #26262a;border-radius:24px;margin-bottom:16px}
.field svg{width:24px;height:24px;flex:none}
.field input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 16px var(--sans);outline:0}
.field input::placeholder{color:#8e8e93}
.field:focus-within{border-color:var(--gold-line)}
.pill{border-radius:26px;height:52px;letter-spacing:.2em;font-size:13px;font-weight:700}

/* Próxima cita (inicio) */
.nxt .name{font:600 16px var(--sans);margin:0}
.nxt hr,.card hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:14px;height:14px}

/* Mis citas */
.vis .svc-n{margin:0;font:400 24px/1.15 var(--serif)}
.vis .when{margin:2px 0 0;color:var(--gold);font-size:13px}
.vis .who{margin:14px 0 0;font:600 14px var(--sans)}
.hist{display:flex;align-items:center;gap:12px}
.hist .t{flex:1;min-width:0}
.hist .t b{display:block;font:600 15px var(--sans)}
.hist .t span{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.hist .r{text-align:right;white-space:nowrap}
.hist .r b{display:block;font:400 18px var(--serif)}
.hist .r span{color:var(--mute);font:600 11px var(--sans)}
.list{display:flex;flex-direction:column;gap:12px}
.ask{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ask .bt{display:flex;gap:10px;flex-wrap:wrap}
.nota{margin:12px 0 0;color:var(--mute);font-size:12px}

/* Pedir cita */
.svc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.svc.on{border-color:var(--gold);box-shadow:0 0 0 .5px var(--gold)}
.svc svg{width:20px;height:20px;color:var(--mute)}
.svc.on svg{color:#fff}
.svc .t{flex:1;min-width:0}
.svc .t b{display:block;font:600 15px var(--sans)}
.svc.on .t b{font-weight:700}
.svc .t span{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.svc .p{font:400 22px var(--serif);color:var(--gold);white-space:nowrap}
.days{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * max(24px,env(safe-area-inset-right,0px)));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:var(--card);border:1px solid var(--line);border-radius:8px}
.day small{font:600 11px var(--sans);color:var(--mute)}
.day b{font:400 20px var(--serif)}
.day.on{background:var(--gold);border-color:var(--gold);color:#0b0b0c}
.day.on small{color:#0b0b0c}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 16px;font:400 13px var(--sans)}
.slot.on{background:var(--chip);border-color:var(--gold);color:var(--gold);font-weight:700}
.vacio{color:var(--mute);font-size:13px;margin:0}

/* Confirmada */
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-top:110px}
.ok svg{width:96px;height:96px;color:var(--gold)}
.ok h2{margin:0;font:400 32px/1.15 var(--serif);max-width:11ch}

/* Productos */
.aviso{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:14px;font-size:13px;line-height:1.4}
.aviso svg{width:20px;height:20px;color:var(--gold)}
.aviso b{color:var(--gold)}
.prod{display:flex;align-items:center;gap:14px;min-height:131px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.pimg{flex:none;width:84px;height:107px;border-radius:6px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:#4a4a4f;overflow:hidden}
.pimg.f{background:#fff}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.pimg svg{width:28px;height:28px}
.prod .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prod .k{font:700 10px var(--sans);color:var(--gold);text-transform:uppercase}
.prod .n{font:600 15px var(--sans)}
.prod .d{color:var(--mute);font-size:12px;line-height:1.4}
.prod .f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.prod .pr{font:400 20px var(--serif);color:var(--gold)}
.chip{background:var(--chip);color:var(--mute);font:600 11px var(--sans);padding:4px 8px;border-radius:4px;white-space:nowrap}

/* Recordatorios */
.back{display:flex;flex-direction:column;gap:14px;padding:20px}
.back .top{display:flex;align-items:center;gap:12px}
.back .ic{width:40px;height:40px;border-radius:20px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold)}
.back .ic svg{width:20px;height:20px}
.back h3{margin:0;font:700 16px var(--sans)}
.back p{margin:2px 0 0;color:var(--mute);font-size:13px}
.back p.l{margin:0}
.alert{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.alert svg{width:18px;height:18px;color:var(--gold);flex:none}
.alert b{display:block;font:600 14px var(--sans)}
.alert span{display:block;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.4}

/* Información */
.map{position:relative;display:flex;align-items:center;justify-content:center;height:160px;border-radius:12px;border:1px solid var(--line);text-decoration:none;overflow:hidden;background:
  linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/40px 40px,
  #17181c}
.map .pin{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--gold);font:600 13px var(--sans)}
.map .pin svg{width:34px;height:34px}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dir b{display:block;font:700 16px var(--sans)}
.dir span{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.tel{margin:-12px 0 0;text-align:center;color:var(--mute);font-size:12px}
.ic-h{display:flex;align-items:center;gap:8px;font:700 14px var(--sans)}
.ic-h svg{width:18px;height:18px;color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.kv span:first-child{color:var(--mute)}
.card .kv+.kv{margin-top:12px}
a.card{display:block;text-decoration:none}
.stars{display:inline-flex;gap:2px;color:var(--gold)}
.stars svg{width:14px;height:14px}
.stars svg.off{fill:none}
.stars svg.on{fill:currentColor}

/* Navegación */
#nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);z-index:20;display:flex;justify-content:space-between;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#nav a{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;color:var(--mute);text-decoration:none;font-size:10px}
#nav a svg{width:22px;height:22px}
#nav a[aria-current="page"]{color:var(--gold);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(390px,calc(100% - 32px));background:#232327;border:1px solid var(--gold-line);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){main>section{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="app">
  <main id="app"></main>
  <nav id="nav" aria-label="Navegación principal" hidden></nav>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>

const HORARIO={1:[600,1260],2:[600,1260],3:[600,1260],4:[600,1260],5:[600,1260],6:[540,1080]};
const PASO=15, DIAS_MAX=14, CANCELAR_MIN_DIAS=2;

/* ---------- Utilidades ---------- */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const keyOf=(date,min)=>date+'_'+pad(Math.floor(min/60))+pad(min%60);
const parseKey=k=>{const a=k.split('_');return{date:a[0],min:+a[1].slice(0,2)*60+ +a[1].slice(2)}};
const startOf=k=>{const p=parseKey(k);const d=fromYmd(p.date);d.setMinutes(p.min);return d};
const endOf=k=>new Date(startOf(k).getTime()+PASO*60000);
const hoy=()=>ymd(new Date());
const diffDias=date=>Math.round((fromYmd(date)-fromYmd(hoy()))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svcById=id=>SERVICIOS.find(s=>s.id===id)||SERVICIOS[0];
function relDia(date){const n=diffDias(date);return n===0?'Hoy':n===1?'Mañana':cap(DIAS[fromYmd(date).getDay()])}
function fechaLarga(date){const d=fromYmd(date);return d.getDate()+' de '+cap(MESES[d.getMonth()])}
function cuando(k){const p=parseKey(k),d=fromYmd(p.date),n=diffDias(p.date);
  const dia=n===0?'Hoy':n===1?'Mañana':cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()];
  return dia+' a las '+hm(p.min)}
function frase(k){const p=parseKey(k),d=fromYmd(p.date),n=diffDias(p.date);
  const dia=n===0?'hoy':n===1?'mañana':'el '+DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];
  return dia+' a las '+hm(p.min)}

const S={name:'',uid:null,db:null,ocupadas:new Set(),bloqueos:[],avisos:[],citas:{}};
const API_URL='https://script.google.com/macros/s/AKfycbwezs19n0GgPax54MLIhKPE1iw9oOWxGZI-DTKGkat01FcoGxdXXC4Q98mDZJDYoomtzQ/exec';
S.uid=LSgetUid();
function LSgetUid(){let u='';try{u=localStorage.getItem('vbs:uid')||'';if(!u){u='vbs_'+Array.from(crypto.getRandomValues(new Uint8Array(20))).map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('vbs:uid',u)}}catch(e){u='vbs_'+Math.random().toString(36).slice(2)+Date.now().toString(36)}return u;}
const ui={sel:{svc:1,date:null,min:null},ask:null,busy:false};
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
S.name=LS.get('vbs:name')||'';S.tel=LS.get('vbs:tel')||'';
try{S.citas=JSON.parse(LS.get('vbs:citas')||'{}')||{}}catch(e){S.citas={}}
const guardarLocal=()=>{LS.set('vbs:name',S.name);LS.set('vbs:tel',S.tel||'');};

/* ---------- Disponibilidad ---------- */
function bloqueado(date,min){
  return S.bloqueos.some(b=>b&&b.date===date&&typeof b.from==='string'&&typeof b.to==='string'&&
    min>=toMin(b.from)&&min<toMin(b.to));
}
function toMin(s){const a=s.split(':');return +a[0]*60+ +a[1]}
function ocupada(k){const c=S.citas[k];return S.ocupadas.has(k)||(c&&c.estado==='confirmada')}
function libre(date,min){
  const d=fromYmd(date),h=HORARIO[d.getDay()];
  if(!h||min<h[0]||min>=h[1])return false;
  if(startOf(keyOf(date,min))<=new Date())return false;
  return !ocupada(keyOf(date,min))&&!bloqueado(date,min);
}
function slotsDe(date){
  const h=HORARIO[fromYmd(date).getDay()];if(!h)return[];
  const r=[];for(let m=h[0];m<h[1];m+=PASO)if(libre(date,m))r.push(m);return r;
}
function diasDisponibles(){
  const r=[],t=new Date();
  for(let i=0;i<=DIAS_MAX;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);
    if(HORARIO[d.getDay()]&&slotsDe(ymd(d)).length)r.push(ymd(d));}
  return r;
}

/* ---------- Citas del usuario ---------- */
function lista(){return Object.keys(S.citas).map(k=>Object.assign({k:k},S.citas[k]))}
function proximas(){const n=new Date();return lista().filter(c=>c.estado==='confirmada'&&endOf(c.k)>n).sort((a,b)=>a.k<b.k?-1:1)}
function historial(){const n=new Date();return lista().filter(c=>c.estado==='confirmada'&&endOf(c.k)<=n).sort((a,b)=>a.k<b.k?1:-1)}
const puedeCancelar=c=>diffDias(parseKey(c.k).date)>=CANCELAR_MIN_DIAS;

/* ---------- Vistas ---------- */
const telOk=v=>v.replace(/\D/g,'').length>=9&&/^[\d\s+()\-.]{9,20}$/.test(v.trim());
const nombreOk=v=>{const p=v.trim().split(/\s+/).filter(Boolean);return p.length>=2&&p.every(x=>/\p{L}/u.test(x))};

V.inicio=()=>{
  const c=proximas()[0];
  let w='';
  if(c){const p=parseKey(c.k);
    w=`<div class="card gold nxt">
      <div class="row"><span class="lbl" style="margin:0;display:inline-flex;align-items:center;gap:8px"><span style="font-size:16px;display:inline-flex">${ic('clock')}</span>Próxima cita</span><span class="badge">CONFIRMADA</span></div>

    let acc;
    if(ui.ask===nx.k)acc=`<div class="ask"><b style="font-size:14px">¿Cancelar esta cita?</b><div class="bt"><button class="btn sm" data-act="cancel-yes" data-v="${nx.k}"${ui.busy?' disabled':''}>Sí, cancelar</button><button class="btn ghost" data-act="cancel-no">No, mantener</button></div></div>`;
    else if(puedeCancelar(nx))acc=`<div style="margin-top:14px"><button class="btn ghost" data-act="cancel-ask" data-v="${nx.k}">Cancelar cita</button></div>`;
    else acc=`<p class="nota">Ya no se puede cancelar: solo se permite hasta 2 días antes de la cita.</p>`;
    a=`<div><p class="lbl">Siguiente Visita</p><div class="card gold vis">
      <div class="row"><div style="min-width:0"><p class="svc-n">${esc(nx.nombre)}</p><p class="when">${esc(cuando(nx.k))}</p></div><span class="badge">CONFIRMADO</span></div>
      <p class="who">${esc(S.name)}</p>${acc}</div></div>`;
  }
  let b='';
  if(h.length)b=`<div><p class="lbl mute">Historial de Visitas</p><div class="list">${h.map(c=>{const p=parseKey(c.k),d=fromYmd(p.date);
    return `<div class="card hist"><div class="t"><b>${esc(c.nombre)}</b><span>${d.getDate()} de ${cap(MESES[d.getMonth()])}, ${d.getFullYear()} · Barbero: ${esc(CFG.barbero)}</span></div><div class="r"><b>${esc(c.precio)}€</b><span>COMPLETADO</span></div></div>`}).join('')}</div></div>`;
  return `<section>${head('Mis Citas','Gestiona tus reservas y visitas')}<div class="pad stack">${a}${b}</div></section>`;
};

function ensureSel(){
  const dias=diasDisponibles();
  if(!ui.sel.date||!dias.includes(ui.sel.date)){ui.sel.date=dias[0]||null;ui.sel.min=null}
  if(ui.sel.min!=null&&!libre(ui.sel.date,ui.sel.min))ui.sel.min=null;
  return dias;
}
V['pedir-cita']=()=>{
  const dias=ensureSel(),sl=ui.sel.date?slotsDe(ui.sel.date):[];
  const svc=SERVICIOS.map(s=>`<button class="svc${ui.sel.svc===s.id?' on':''}" data-act="svc" data-v="${s.id}" aria-pressed="${ui.sel.svc===s.id}">${ic('scissors')}<span class="t"><b>${esc(s.n)}</b><span>Duración: ${s.dur}min</span></span><span class="p">${s.p}€</span></button>`).join('');
  const dd=dias.map(d=>{const dt=fromYmd(d);return `<button class="day${ui.sel.date===d?' on':''}" data-act="day" data-v="${d}" aria-pressed="${ui.sel.date===d}"><small>${DIAS3[dt.getDay()]}</small><b>${dt.getDate()}</b></button>`}).join('');
  const ss=sl.length?`<div class="slots">${sl.map(m=>`<button class="slot${ui.sel.min===m?' on':''}" data-act="slot" data-v="${m}" aria-pressed="${ui.sel.min===m}">${hm(m)}</button>`).join('')}</div>`:`<p class="vacio">${dias.length?'No quedan horas libres este día.':'No hay horas libres en las próximas 2 semanas.'}</p>`;

    <div><p class="lbl" style="margin-bottom:10px">3. Horarios Disponibles</p>${ss}</div>
    <button class="btn" data-act="reservar"${ui.sel.min==null||ui.busy?' disabled':''}><span style="font-size:18px;display:inline-flex">${ic('check')}</span>Confirmar Cita</button>

};

const esApple=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
function urlMapa(){const q=encodeURIComponent(CFG.consultaMapa);return esApple()?'https://maps.apple.com/?q='+q:'https://www.google.com/maps/search/?api=1&query='+q}

      <div class="kv"><span>Lunes a Viernes</span><span>10:00 - 21:00</span></div>

      <div class="row" style="font-size:14px"><span>Instagram</span><b class="gold-t" style="font-weight:600">@${esc(CFG.instagram)}</b></div></a>

function avisosLibres(){
  const lim=new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()+DIAS_MAX+1);
  const seen=new Set();
  return S.avisos.filter(a=>a&&typeof a.slot==='string').sort((x,y)=>(y.ts||0)-(x.ts||0)).filter(a=>{
    if(seen.has(a.slot))return false;seen.add(a.slot);
    const p=parseKey(a.slot);return startOf(a.slot)>new Date()&&startOf(a.slot)<lim&&libre(p.date,p.min)}).slice(0,4);
}
V.recordatorios=()=>{
  const up=proximas(),h=historial(),lib=avisosLibres();
  let volver='';
  if(h.length&&!up.length){const n=-diffDias(parseKey(h[0].k).date);
    if(n>=21)volver=`<div class="card gold back"><div class="top"><span class="ic">${ic('circlex')}</span><div><h3>¿Hora de volver?</h3><p class="l">Han pasado ${n} días desde tu último corte.</p></div></div>
      <p class="l" style="margin:0">Mantener un corte de cabello impecable requiere un mantenimiento cada 3 semanas. Agenda tu visita recomendada hoy mismo.</p>
      <a class="btn" href="#pedir-cita"><span style="font-size:18px;display:inline-flex">${ic('calendar')}</span>Reservar Día Recomendado</a></div>`;}
  const items=up.map(c=>`<div class="alert">${ic('alert')}<div><b>Confirmación de Cita</b><span>Tu cita para ${esc(frase(c.k))} ha sido confirmada con éxito.</span></div></div>`)
    .concat(lib.map(a=>`<button class="alert" data-act="libre" data-v="${esc(a.slot)}">${ic('clock')}<div><b>Hora disponible</b><span>${esc(cap(frase(a.slot)))} ha quedado libre. Toca para reservarla.</span></div></button>`));
  lista().filter(c=>c.estado==='cancelada'&&c.motivo==='barberia'&&endOf(c.k)>new Date()).forEach(c=>items.unshift(`<div class="alert">${ic('alert')}<div><b>Cita cancelada</b><span>Tu cita para ${esc(frase(c.k))} ha sido cancelada por la barbería. Puedes reservar otra hora.</span></div></div>`));
  const al=items.length?`<div><p class="lbl mute">Alertas Activas</p><div class="list">${items.join('')}</div></div>`:'';
  return `<section>${head('Recordatorios','Tus alertas y avisos personalizados',true)}<div class="pad stack" style="gap:20px">${volver}${al}</div></section>`;
};

/* ---------- Navegación y pintado ---------- */
const RUTAS=['inicio','citas','pedir-cita','productos','recordatorios','info','confirmada'];
function ruta(){
  if(!S.name||!S.tel)return'login';
  const r=location.hash.slice(1);
  return RUTAS.includes(r)?r:'inicio';
}
const NAV=[['inicio','Inicio','house'],['citas','Citas','calendar'],['productos','Productos','bag'],['info','Info','help']];
const NAV_ACT={'pedir-cita':'citas','confirmada':'citas','recordatorios':''};
function render(){
  const r=ruta(),app=document.getElementById('app'),nav=document.getElementById('nav');
  const dr=document.querySelector('.days'),sx=dr?dr.scrollLeft:0,sy=window.scrollY;
  app.innerHTML=V[r]();
  app.className=r==='login'?'sin-nav':'';
  nav.hidden=r==='login';
  const act=r in NAV_ACT?NAV_ACT[r]:r;
  nav.innerHTML=NAV.map(n=>`<a href="#${n[0]}"${n[0]===act?' aria-current="page"':''}>${ic(n[2])}<span>${n[1]}</span></a>`).join('');
  const d2=document.querySelector('.days');if(d2)d2.scrollLeft=sx;
  if(r==='login')initLogin();
  if(app.dataset.r===r)window.scrollTo(0,sy);else window.scrollTo(0,0);
  app.dataset.r=r;
}
let raf=0;
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(ruta()!=='login')render()})}
function initLogin(){
  const inp=document.getElementById('nombre'),tel=document.getElementById('telefono'),btn=document.getElementById('continuar');
  inp.value=S.name||'';tel.value=S.tel||'';
  const upd=()=>{btn.disabled=!(nombreOk(inp.value)&&telOk(tel.value))};
  inp.addEventListener('input',upd);tel.addEventListener('input',upd);upd();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});tel.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  btn.addEventListener('click',go);
  function go(){
    if(!(nombreOk(inp.value)&&telOk(tel.value)))return;
    S.name=inp.value.trim().replace(/\s+/g,' ');S.tel=tel.value.trim();guardarLocal();
    refrescarEstado();
    location.hash='inicio';render();
  }
}
let tt=0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},4200)}

/* ---------- Acciones ---------- */
async function reservar(){
  if(ui.busy||ui.sel.min==null)return;
  const date=ui.sel.date,min=ui.sel.min,k=keyOf(date,min),sv=svcById(ui.sel.svc);
  if(!libre(date,min)){toast('Esa hora ya no está libre. Elige otra.');ui.sel.min=null;return render()}
  ui.busy=true;render();
  try{
    await enviarServidor({accion:'reservar',uid:S.uid,nombre:S.name,tel:S.tel||'',servicio:sv.n,date:date,min:min,dur:PASO});
    const estado=await refrescarEstado();
    if(!(estado.mias||[]).some(c=>c.date===date&&Number(c.min)===min)){throw new Error('No se pudo confirmar la reserva. Comprueba que la hora siga libre y que tus datos sean correctos.')}
    ui.sel.min=null;ui.busy=false;location.hash='confirmada';render();
  }catch(e){ui.busy=false;toast(e.message||'No se pudo guardar la cita. Inténtalo de nuevo.');render()}
}
async function cancelar(k){
  if(ui.busy)return;const c=S.citas[k];if(!c||!puedeCancelar(Object.assign({k:k},c))){ui.ask=null;return render()}
  ui.busy=true;render();
  try{
    await enviarServidor({accion:'cancelar',uid:S.uid,id:c.id||''});
    const estado=await refrescarEstado();
    if((estado.mias||[]).some(x=>x.id===c.id))throw new Error('No se pudo cancelar. Recuerda que hacen falta 48 horas de antelación.');
    ui.ask=null;ui.busy=false;toast('Cita cancelada. La hora ha quedado libre.');render();
  }catch(e){ui.busy=false;toast(e.message||'No se pudo cancelar la cita. Inténtalo de nuevo.');render()}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='svc')ui.sel.svc=+v;
  else if(a==='day'){ui.sel.date=v;ui.sel.min=null}
  else if(a==='slot')ui.sel.min=+v;
  else if(a==='reservar')return reservar();
  else if(a==='cancel-ask')ui.ask=v;
  else if(a==='cancel-no')ui.ask=null;
  else if(a==='cancel-yes')return cancelar(v);
  else if(a==='libre'){const p=parseKey(v);ui.sel.date=p.date;ui.sel.min=p.min;location.hash='pedir-cita';return}
  render();
});
window.addEventListener('hashchange',()=>{ui.ask=null;render()});

function avisarAnuladas(){
  let v=[];try{v=JSON.parse(LS.get('vbs:vistos')||'[]')}catch(e){}
  const n=lista().filter(c=>c.estado==='cancelada'&&c.motivo==='barberia'&&endOf(c.k)>new Date()&&!v.includes(c.k));
  if(!n.length)return;
  LS.set('vbs:vistos',JSON.stringify(v.concat(n.map(c=>c.k)).slice(-50)));
  toast('La barbería ha cancelado tu cita para '+frase(n[0].k)+'. Reserva otra hora.');
}
/* ---------- Conexión con Google Apps Script y Google Calendar ---------- */
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='vbs_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const script=document.createElement('script');let timer;
    window[cb]=data=>{clearTimeout(timer);delete window[cb];script.remove();resolve(data)};
    script.onerror=()=>{clearTimeout(timer);delete window[cb];script.remove();reject(new Error('No se pudo conectar con el servidor de reservas.'))};
    timer=setTimeout(()=>{delete window[cb];script.remove();reject(new Error('El servidor tardó demasiado en responder.'))},15000);
    script.src=url+(url.includes('?')?'&':'?')+'accion=estado&uid='+encodeURIComponent(S.uid)+'&callback='+cb+'&_='+Date.now();
    document.head.appendChild(script);
  });
}
function enviarServidor(data){
  return new Promise((resolve,reject)=>{
    const frame=document.createElement('iframe'),form=document.createElement('form'),field=document.createElement('input');
    const target='vbs_post_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    frame.name=target;frame.style.display='none';form.method='POST';form.action=API_URL;form.target=target;form.style.display='none';
    field.type='hidden';field.name='payload';field.value=JSON.stringify(data);form.appendChild(field);
    let done=false;const finish=()=>{if(done)return;done=true;setTimeout(()=>{form.remove();frame.remove()},300);refrescarEstado().then(()=>resolve({ok:true})).catch(reject)};
    frame.onload=()=>{if(frame.dataset.ready==='1')finish();else frame.dataset.ready='1'};
    document.body.appendChild(frame);document.body.appendChild(form);form.submit();
    setTimeout(()=>{if(!done)finish()},4500);
    setTimeout(()=>{if(!done){done=true;form.remove();frame.remove();reject(new Error('No se recibió respuesta del servidor.'))}},18000);
  });
}
async function refrescarEstado(){
  const data=await jsonp(API_URL);if(!data||!data.ok)throw new Error(data&&data.error?data.error:'No se pudo leer el calendario.');
  S.bloqueos=data.bloqueos||[];S.ocupadas=new Set();
  const citas={};
  (data.mias||[]).forEach(c=>{const k=keyOf(c.date,Number(c.min));citas[k]={id:c.id,nombre:c.servicio,precio:0,dur:Number(c.dur)||PASO,estado:'confirmada',creada:0}});
  (data.anuladas||[]).forEach(c=>{const k=keyOf(c.date,Number(c.min));citas[k]={nombre:c.servicio||'Cita',dur:PASO,estado:'cancelada',motivo:'barberia'}});
  S.citas=citas;avisarAnuladas();sched();return data;
}
async function iniciarDb(){
  try{await refrescarEstado()}catch(e){toast(e.message||'No se pudo conectar con Google Calendar.')}
}

render();
iniciarDb();
setInterval(()=>{if(ruta()!=='login'&&!ui.busy)render()},60000);
</script>
